<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Cloudflare Workers 登录演示" />
    <title>登录 · Cloudflare Demo</title>
    <link rel="stylesheet" href="/styles.css" />
    <script src="/login.js" defer></script>
  </head>
  <body>
    <main class="page-shell">
      <section class="login-card" aria-labelledby="login-title">
        <div class="brand-mark" aria-hidden="true">
          <span></span>
        </div>

        <p class="eyebrow">CLOUDFLARE WORKERS</p>
        <h1 id="login-title">欢迎回来</h1>
        <p class="subtitle">登录你的演示账户，继续访问控制台。</p>

        <form id="login-form" novalidate>
          <label for="username">用户名</label>
          <div class="input-wrap">
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <path d="M20 21a8 8 0 0 0-16 0M12 13a5 5 0 1 0 0-10 5 5 0 0 0 0 10Z" />
            </svg>
            <input
              id="username"
              name="username"
              type="text"
              autocomplete="username"
              placeholder="请输入用户名"
              required
              autofocus
            />
          </div>

          <label for="password">密码</label>
          <div class="input-wrap">
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <path d="M6 10V8a6 6 0 0 1 12 0v2M5 10h14v11H5V10Zm7 4v3" />
            </svg>
            <input
              id="password"
              name="password"
              type="password"
              autocomplete="current-password"
              placeholder="请输入密码"
              required
            />
          </div>

          <p id="form-message" class="form-message" role="alert" aria-live="polite"></p>

          <button id="submit-button" type="submit">
            <span class="button-label">登录</span>
            <span class="spinner" aria-hidden="true"></span>
          </button>
        </form>

        <p class="demo-hint">演示账号：admin · 密码：123123</p>
      </section>

      <p class="powered-by">由 Cloudflare 全球网络提供支持</p>
    </main>
  </body>
</html>
